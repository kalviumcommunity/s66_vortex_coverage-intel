[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coverage-intel"
version = "0.1.0"
description = "RAG-based insurance coverage intelligence assistant for claims adjusters"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["rag", "llm", "insurance", "retrieval", "grounding", "citations"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "tenacity>=8.3",
  "tiktoken>=0.7",
  "chromadb>=0.5",
  "rank-bm25>=0.2.2",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "python-dateutil>=2.9",
  "orjson>=3.10",
  "structlog>=24.4",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.9"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-python-dateutil",
]

[project.scripts]
coverage-intel = "coverage_intel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coverage_intel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "S", "C4", "PTH", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["chromadb.*", "qdrant_client.*", "tiktoken.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "integration: requires live services",
  "slow: long-running evaluation",
]
